# pnpm settings. Dependency versions live in package.json; overrides pin
# transitive packages to patched releases.
overrides:
  "@babel/core": 7.29.6
  "@babel/plugin-transform-modules-systemjs": 7.29.4
  esbuild: 0.28.1
  fast-uri: 3.1.2
  js-yaml: 4.3.2
  marked: 18.0.5
  "minimatch@10>brace-expansion": 5.0.6
  nanoid: 3.3.19
  postcss: 8.5.28
  serialize-javascript: 7.0.5
  source-map-js: 1.2.2
  tinypool: 2.1.2
  ws: 8.21.0

# Dependency lifecycle scripts never run: the Nix build installs offline with
# --ignore-scripts, so local installs stay identical. esbuild's postinstall only
# re-validates its prebuilt binary.
allowBuilds:
  esbuild: false
